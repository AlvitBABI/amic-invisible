<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amic Invisible Segur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-red-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [state, setState] = React.useState({
                step: 'setup', // 'setup', 'participant', 'admin'
                namesText: '',
                participants: [], // { name, pin, recipient, wishlist }
                adminPin: '1234',
                emergencyToken: ''
            });

            const [loginInput, setLoginInput] = React.useState({ type: 'pin', value: '' });
            const [error, setError] = React.useState('');
            const [copied, setCopied] = React.useState(false);
            const [emergencyCopied, setEmergencyCopied] = React.useState(false);
            const [currentUser, setCurrentUser] = React.useState(null);

            // Load data from URL hash on mount
            React.useEffect(() => {
                const hash = window.location.hash.substring(1);
                if (hash) {
                    try {
                        const decoded = JSON.parse(atob(hash));
                        if (decoded.participants && decoded.adminPin) {
                            setState(prev => ({
                                ...prev,
                                participants: decoded.participants,
                                adminPin: decoded.adminPin,
                                emergencyToken: decoded.emergencyToken || '',
                                step: 'participant'
                            }));
                        }
                    } catch (e) {
                        console.error("Error decoding hash", e);
                    }
                }

                // Check emergency admin trigger in URL
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === 'true') {
                    setState(prev => ({ ...prev, step: 'admin' }));
                }
            }, []);

            // Helper to encode state into URL hash
            const updateUrlHash = (participants, adminPin, emergencyToken) => {
                const payload = JSON.stringify({ participants, adminPin, emergencyToken });
                const encoded = btoa(unescape(encodeURIComponent(payload)));
                window.location.hash = encoded;
            };

            const handleDraw = () => {
                const names = state.namesText
                    .split('\n')
                    .map(n => n.trim())
                    .filter(n => n.length > 0);

                if (names.length < 3) {
                    setError("Si us plau, introduïu almenys 3 noms.");
                    return;
                }

                // Shuffle names for secret santa
                let shuffled = [...names];
                let attempts = 0;
                let valid = false;

                while (!valid && attempts < 100) {
                    attempts++;
                    shuffled.sort(() => Math.random() - 0.5);
                    valid = names.every((name, i) => shuffled[i] !== name);
                }

                if (!valid) {
                    setError("No s'ha pogut fer el sorteig de manera justa. Torneu-ho a provar.");
                    return;
                }

                // Generate random 4-digit PINs for each participant
                const newParticipants = names.map((name, index) => {
                    const pin = Math.floor(1000 + Math.random() * 9000).toString();
                    return {
                        name,
                        pin,
                        recipient: shuffled[index],
                        wishlist: []
                    };
                });

                const emergencyToken = Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);

                setState(prev => ({
                    ...prev,
                    participants: newParticipants,
                    emergencyToken,
                    step: 'admin'
                }));

                updateUrlHash(newParticipants, state.adminPin, emergencyToken);
                setError('');
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');

                if (loginInput.value === state.adminPin) {
                    setState(prev => ({ ...prev, step: 'admin' }));
                    return;
                }

                const found = state.participants.find(p => p.pin === loginInput.value);
                if (found) {
                    setCurrentUser(found);
                } else {
                    setError("Codi PIN incorrecte.");
                }
            };

            const updateWishlist = (name, value) => {
                const updated = state.participants.map(p => {
                    if (p.name === name) {
                        return { ...p, wishlist: value.split(',').map(item => item.trim()).filter(Boolean) };
                    }
                    return p;
                });
                
                setState(prev => ({ ...prev, participants: updated }));
                updateUrlHash(updated, state.adminPin, state.emergencyToken);

                // Keep current user updated in real-time state
                const updatedUser = updated.find(p => p.name === name);
                if (updatedUser) {
                    setCurrentUser(updatedUser);
                }
            };

            const copyMasterLink = () => {
                const cleanUrl = window.location.origin + window.location.pathname + window.location.hash;
                navigator.clipboard.writeText(cleanUrl);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const getEmergencyLink = () => {
                return window.location.origin + window.location.pathname + '?admin=true#' + window.location.hash.substring(1);
            };

            const copyEmergencyLink = () => {
                navigator.clipboard.writeText(getEmergencyLink());
                setEmergencyCopied(true);
                setTimeout(() => setEmergencyCopied(false), 2000);
            };

            // Find the recipient data for the currently logged-in user to fetch their wishlist
            const recipientData = currentUser ? state.participants.find(p => p.name === currentUser.recipient) : null;

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col justify-between">
                    {/* Header */}
                    <header className="text-center py-6">
                        <div className="inline-flex items-center justify-center p-3 bg-red-900/40 rounded-full mb-2 border border-red-700/50">
                            <svg className="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>
                        </div>
                        <h1 className="text-2xl font-bold tracking-tight text-red-200">Amic Invisible Secret</h1>
                        <p className="text-xs text-slate-400 mt-1">Sempre segur, sense comptes i protegit amb PIN</p>
                    </header>

                    {/* Main Container */}
                    <main className="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl my-2">
                        
                        {/* SETUP SCREEN (No draw done yet) */}
                        {state.step === 'setup' && state.participants.length === 0 && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-semibold text-slate-200">Panell de l'Organitzador</h2>
                                <p className="text-xs text-slate-400">Introdueix els noms dels participants (un per línia) per crear el sorteig:</p>
                                
                                <textarea 
                                    rows="6"
                                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-red-500"
                                    placeholder="Marta&#10;Jordi&#10;Anna&#10;Marc"
                                    value={state.namesText}
                                    onChange={e => setState({ ...state, namesText: e.target.value })}
                                />

                                <div>
                                    <label className="block text-xs font-medium text-slate-400 mb-1">Codi PIN de l'Organitzador (4 dígits):</label>
                                    <input 
                                        type="password" 
                                        maxLength="4"
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-red-500"
                                        value={state.adminPin}
                                        onChange={e => setState({ ...state, adminPin: e.target.value })}
                                    />
                                </div>

                                {error && <p className="text-xs text-red-400 font-medium">{error}</p>}

                                <button 
                                    onClick={handleDraw}
                                    className="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-red-900/30 text-sm">
                                    Sortejar Amic Invisible!
                                </button>
                            </div>
                        )}

                        {/* PARTICIPANT LOGIN / HOME SCREEN */}
                        {state.participants.length > 0 && state.step !== 'admin' && !currentUser && (
                            <div className="space-y-5 text-center py-2">
                                <div className="space-y-1">
                                    <h2 className="text-lg font-semibold text-slate-200">Identificació</h2>
                                    <p className="text-xs text-slate-400">Introdueix el teu codi PIN de 4 dígits per veure el teu amic invisible:</p>
                                </div>

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input 
                                        type="password" 
                                        maxLength="4"
                                        autoFocus
                                        placeholder="••••"
                                        className="w-32 mx-auto text-center tracking-widest text-2xl bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-red-500 block"
                                        value={loginInput.value}
                                        onChange={e => setLoginInput({ ...loginInput, value: e.target.value })}
                                    />

                                    {error && <p className="text-xs text-red-400 font-medium">{error}</p>}

                                    <button 
                                        type="submit"
                                        className="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-red-900/30 text-sm">
                                        Entrar amb el meu PIN
                                    </button>
                                </form>

                                <div className="pt-4 border-t border-slate-800 text-left">
                                    <details className="text-xs text-slate-400 cursor-pointer">
                                        <summary className="hover:text-slate-200 transition">Ets l'organitzador?</summary>
                                        <div className="mt-2 space-y-2">
                                            <p>Introdueix el PIN d'organitzador per accedir al llistat general.</p>
                                        </div>
                                    </details>
                                </div>
                            </div>
                        )}

                        {/* PARTICIPANT VIEW (Logged in) */}
                        {currentUser && (
                            <div className="space-y-4">
                                <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs uppercase tracking-wider text-red-400 font-semibold">Hola, {currentUser.name}</span>
                                    <h3 className="text-lg font-bold text-slate-100 mt-1">Has de regalar a:</h3>
                                    <div className="my-3 py-3 px-4 bg-red-950/40 border border-red-800/60 rounded-xl text-xl font-bold text-red-200">
                                        🎁 {currentUser.recipient}
                                    </div>
                                    
                                    {/* RECIPIENT'S WISHLIST VIEW */}
                                    <div className="mt-4 pt-3 border-t border-slate-800 text-left">
                                        <p className="text-xs font-semibold text-slate-300 mb-1">Suggeriments de regal de {currentUser.recipient}:</p>
                                        {recipientData && recipientData.wishlist.length > 0 ? (
                                            <ul className="list-disc list-inside space-y-1 bg-slate-900/80 p-2.5 rounded-lg border border-slate-800 text-xs text-slate-200">
                                                {recipientData.wishlist.map((item, idx) => (
                                                    <li key={idx}>{item}</li>
                                                ))}
                                            </ul>
                                        ) : (
                                            <p className="text-[11px] text-slate-500 italic bg-slate-900/40 p-2 rounded-lg">Encara no ha afegit cap suggeriment.</p>
                                        )}
                                    </div>
                                </div>

                                {/* EDIT OWN WISHLIST SECTION */}
                                <div className="text-left space-y-2 pt-2 border-t border-slate-800">
                                    <label className="block text-xs font-medium text-slate-300">Afegeix els teus propis suggeriments (separats per comes):</label>
                                    <input 
                                        type="text"
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-red-500"
                                        placeholder="Ex: Llibre, Bufanda, Xocolata"
                                        value={currentUser.wishlist.join(', ')}
                                        onChange={e => updateWishlist(currentUser.name, e.target.value)}
                                    />
                                    <p className="text-[10px] text-slate-500">S'actualitza automàticament per a qui et regala.</p>
                                </div>

                                <button 
                                    onClick={() => setCurrentUser(null)}
                                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium py-2.5 rounded-xl transition">
                                    Tancar Sessió
                                </button>
                            </div>
                        )}

                        {/* ADMIN VIEW */}
                        {state.step === 'admin' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h2 className="text-md font-bold text-red-400">Panell d'Organitzador</h2>
                                    <button 
                                        onClick={() => setState(prev => ({ ...prev, step: 'participant' }))}
                                        className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">
                                        Tancar Panell
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs text-slate-400">Enllaç general per compartir amb la família:</p>
                                    <div className="flex gap-2">
                                        <input 
                                            readOnly 
                                            value={window.location.origin + window.location.pathname + window.location.hash}
                                            className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 select-all"
                                        />
                                        <button 
                                            onClick={copyMasterLink}
                                            className="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-xl text-xs font-medium transition whitespace-nowrap">
                                            {copied ? 'Copiat!' : 'Copiar'}
                                        </button>
                                    </div>
                                </div>

                                {/* EMERGENCY ADMIN LINK SECTION */}
                                <div className="bg-red-950/20 border border-red-900/40 p-3 rounded-xl space-y-2">
                                    <p className="text-[11px] text-red-300 font-medium">⚠️ Enllaç d'Emergència (Guarda'l per si oblides el PIN):</p>
                                    <div className="flex gap-2">
                                        <input 
                                            readOnly 
                                            value={getEmergencyLink()}
                                            className="w-full bg-slate-950 border border-red-900/60 rounded-xl px-3 py-2 text-[10px] text-slate-400 select-all"
                                        />
                                        <button 
                                            onClick={copyEmergencyLink}
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium transition whitespace-nowrap">
                                            {emergencyCopied ? 'Copiat!' : 'Desar'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs font-medium text-slate-300">Llistat de PINs (Només visible per a tu):</p>
                                    <div className="max-h-48 overflow-y-auto space-y-2 pr-1">
                                        {state.participants.map((p, i) => (
                                            <div key={i} className="flex justify-between items-center bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs">
                                                <div>
                                                    <span className="font-semibold text-slate-200">{p.name}</span>
                                                    <span className="block text-[10px] text-slate-500">Regala a: {p.recipient}</span>
                                                </div>
                                                <div className="bg-red-950/50 border border-red-800/60 px-2.5 py-1 rounded-lg text-red-300 font-mono font-bold">
                                                    PIN: {p.pin}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="text-center text-[10px] text-slate-500 py-2">
                        Fet amb ❤️ per a la família • Segur i privat
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
